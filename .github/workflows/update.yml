# Varje natt: export från Flickr (nya/ändrade foton, album, upp till 1 000 nya EXIF),
# commit av data/ och config/ om något ändrats, bygge av dist/ och publicering på
# GitHub Pages (ulfbodin.se/flickr-archive/). Kan också köras för hand under Actions.
name: Update from Flickr

on:
  schedule:
    - cron: "17 2 * * *"  # 03.17 svensk vintertid
  workflow_dispatch:
    inputs:
      exif:
        description: "EXIF för upp till N bilder som saknas (0 = ingen, all = alla)"
        default: "1000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Export från Flickr
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: python export/flickr_export.py --exif "${{ github.event.inputs.exif || '1000' }}"

      - name: Spara ändrade data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data config
          if git diff --cached --quiet; then
            echo "Inga ändringar."
          else
            git commit -m "Uppdatering från Flickr $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Bygg sidan
        run: python build/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
