# Varje natt: export från Flickr (nya/ändrade foton, album, upp till 1 000 nya EXIF),
# commit av data/ om något ändrats, bygge av dist/ och publicering på
# GitHub Pages (ulfbodin.se/flickr-archive/). Kan också köras för hand under Actions.
# En push av kod eller config (inte data/) bygger och publicerar direkt - utan export.
name: Update archive

on:
  schedule:
    - cron: "17 2 * * *"  # 03.17 svensk vintertid
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  workflow_dispatch:
    inputs:
      exif:
        description: "EXIF för upp till N bilder som saknas (0 = ingen, all = alla)"
        default: "1000"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Export från Flickr
        if: github.event_name != 'push'
        env:
          FLICKR_API_KEY: ${{ secrets.FLICKR_API_KEY }}
        run: python export/flickr_export.py --exif "${{ github.event.inputs.exif || '1000' }}"

      - name: Spara ändrade data
        if: github.event_name != 'push'
        # Bara data/ committas - config/ är din och skrivs aldrig över av en körning.
        # Har du pushat under körningen läggs flödets commit ovanpå din (rebase);
        # data/ skrivs bara av flödet, så vid krock där gäller flödets version.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Inga ändringar."
            exit 0
          fi
          git commit -m "Uppdatering från Flickr $(date -u +%Y-%m-%d)"
          git checkout -- config 2>/dev/null || true
          for attempt in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Pushen misslyckades (försök $attempt) - försöker igen."
            sleep 10
          done
          exit 1

      - name: Bygg sidan
        run: python build/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
